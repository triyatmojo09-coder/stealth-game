<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Protocol — a stealth game</title>
<link rel="icon" href="data:,">
<style>
  /* Bundled type: Black Ops One for display, Rajdhani for HUD and body.
     Subset woff2 files live beside the game — no network, ever. */
  @font-face {
    font-family: 'Black Ops One';
    src: url('./assets/fonts/blackops.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Rajdhani';
    src: url('./assets/fonts/rajdhani-medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Rajdhani';
    src: url('./assets/fonts/rajdhani-semibold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Rajdhani';
    src: url('./assets/fonts/rajdhani-bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #04060b;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #070a12;
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
